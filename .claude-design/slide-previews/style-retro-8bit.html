<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro: 8-Bit Style</title>
    <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=figtree:600,700,800">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-light: #ffffff;
            --text-light: #000000;
            --border-light: #333333;

            --bg-dark: #1a1a1a;
            --text-dark: #ffffff;
            --border-dark: #cccccc;
        }

        body {
            font-family: 'Figtree', sans-serif;
            background: var(--bg-light);
            color: var(--text-light);
            transition: background 0.3s, color 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
        }

        body.dark-mode {
            background: var(--bg-dark);
            color: var(--text-dark);
        }

        /* Thick 8-bit scan lines */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.05),
                rgba(0, 0, 0, 0.05) 3px,
                transparent 3px,
                transparent 6px
            );
            z-index: 2;
        }

        .preview-container {
            width: 100%;
            max-width: 1200px;
            padding: 4rem;
            border: 6px solid var(--border-light);
            border-radius: 16px;
            position: relative;
            background: var(--bg-light);
            box-shadow:
                inset 0 0 0 2px var(--border-light),
                inset 0 0 0 4px var(--border-light),
                6px 6px 0 rgba(0,0,0,0.2);
            z-index: 1;
        }

        body.dark-mode .preview-container {
            background: var(--bg-dark);
            border-color: var(--border-dark);
            box-shadow:
                inset 0 0 0 2px var(--border-dark),
                inset 0 0 0 4px var(--border-dark),
                6px 6px 0 rgba(0,0,0,0.4);
        }

        .toggle-btn {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            padding: 0.9rem 1.8rem;
            background: var(--text-light);
            color: var(--bg-light);
            border: 4px solid var(--text-light);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 800;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 5px 5px 0 rgba(0,0,0,0.25);
            transition: all 0.08s;
        }

        .toggle-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 3px 3px 0 rgba(0,0,0,0.25);
        }

        body.dark-mode .toggle-btn {
            background: var(--text-dark);
            color: var(--bg-dark);
            border-color: var(--text-dark);
        }

        h1 {
            font-family: 'Figtree', sans-serif;
            font-size: 4rem;
            line-height: 1;
            margin-bottom: 0.5rem;
            font-weight: 800;
            letter-spacing: -1px;
            text-shadow: 3px 3px 0 rgba(0,0,0,0.15);
        }

        body.dark-mode h1 {
            text-shadow: 3px 3px 0 rgba(255,255,255,0.15);
        }

        .tagline {
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 2rem;
            opacity: 0.8;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.8;
            margin-top: 1.5rem;
            font-weight: 700;
        }

        .feature-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.5rem;
            margin-top: 2.5rem;
        }

        .feature-card {
            padding: 1.75rem;
            border: 4px solid var(--border-light);
            border-radius: 12px;
            background: transparent;
            font-weight: 800;
            font-size: 0.95rem;
            text-transform: uppercase;
            box-shadow: 5px 5px 0 rgba(0,0,0,0.18);
            transition: all 0.08s;
        }

        body.dark-mode .feature-card {
            border-color: var(--border-dark);
            box-shadow: 5px 5px 0 rgba(255,255,255,0.18);
        }

        .feature-card:hover {
            transform: translate(-1px, -1px);
            box-shadow: 6px 6px 0 rgba(0,0,0,0.25);
        }

        .feature-card .icon {
            font-size: 2rem;
            margin-bottom: 0.75rem;
            line-height: 1;
        }

        .accent-bar {
            width: 100%;
            height: 6px;
            background: var(--text-light);
            margin: 2rem 0;
            box-shadow: 3px 3px 0 rgba(0,0,0,0.2);
        }

        body.dark-mode .accent-bar {
            background: var(--text-dark);
            box-shadow: 3px 3px 0 rgba(255,255,255,0.2);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        h1 { animation: slideIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
        p { animation: slideIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.1s both; }
        .feature-grid { animation: slideIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s both; }
    </style>
</head>
<body>
    <button class="toggle-btn" onclick="toggleDarkMode()">8BIT</button>

    <div class="preview-container">
        <h1>8BIT</h1>
        <div class="tagline">» ARCADE ERA</div>
        <div class="accent-bar"></div>

        <p>Ultra-chunky pixels and bold shadows. Arcade game vibes, maximum retro energy!</p>

        <div class="feature-grid">
            <div class="feature-card">
                <div class="icon">█</div>
                <strong>Chunky</strong>
            </div>
            <div class="feature-card">
                <div class="icon">▮</div>
                <strong>Bold</strong>
            </div>
            <div class="feature-card">
                <div class="icon">◾</div>
                <strong>Pixels</strong>
            </div>
            <div class="feature-card">
                <div class="icon">⬛</div>
                <strong>Power</strong>
            </div>
        </div>
    </div>

    <script>
        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
        }
    </script>
</body>
</html>
