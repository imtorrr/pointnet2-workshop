<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Style A: Tech Energized</title>
    <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi:400,500,700&f[]=clash-display:700">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-light: #ffffff;
            --bg-light-secondary: #f8f9fa;
            --text-light: #1a1a1a;
            --accent-light: #00d4ff;

            --bg-dark: #0f1419;
            --bg-dark-secondary: #1a202c;
            --text-dark: #ffffff;
            --accent-dark: #00d4ff;
        }

        body {
            font-family: 'Satoshi', sans-serif;
            background: var(--bg-light);
            color: var(--text-light);
            transition: background 0.3s, color 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
        }

        body.dark-mode {
            background: var(--bg-dark);
            color: var(--text-dark);
        }

        .preview-container {
            width: 100%;
            max-width: 1200px;
            padding: 4rem;
            border-radius: 16px;
            background: var(--bg-light-secondary);
            border: 2px solid var(--accent-light);
            position: relative;
        }

        body.dark-mode .preview-container {
            background: var(--bg-dark-secondary);
        }

        .toggle-btn {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            padding: 0.5rem 1rem;
            background: var(--accent-light);
            color: var(--bg-light);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.875rem;
        }

        body.dark-mode .toggle-btn {
            background: var(--accent-dark);
            color: var(--bg-dark);
        }

        h1 {
            font-family: 'Clash Display', sans-serif;
            font-size: 4rem;
            line-height: 1.1;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, var(--accent-light), #0099ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        body.dark-mode h1 {
            background: linear-gradient(135deg, #00d4ff, #0099ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        p {
            font-size: 1.25rem;
            line-height: 1.6;
            opacity: 0.8;
            margin-top: 1.5rem;
        }

        .emoji-dots {
            display: flex;
            gap: 0.5rem;
            margin-top: 2rem;
            font-size: 2rem;
        }

        .slide-hint {
            margin-top: 2rem;
            padding: 1rem;
            background: var(--accent-light);
            color: var(--bg-light);
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 600;
        }

        body.dark-mode .slide-hint {
            background: var(--accent-dark);
            color: var(--bg-dark);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .emoji-dots span { animation: float 3s ease-in-out infinite; }
        .emoji-dots span:nth-child(2) { animation-delay: 0.2s; }
        .emoji-dots span:nth-child(3) { animation-delay: 0.4s; }
        .emoji-dots span:nth-child(4) { animation-delay: 0.6s; }
    </style>
</head>
<body>
    <button class="toggle-btn" onclick="toggleDarkMode()">🌙 Dark Mode</button>

    <div class="preview-container">
        <h1>Tech Energized ⚡</h1>
        <p>Modern, bold cyan accents with tech vibes. Clear structure, high energy, perfect for keeping attention during technical content.</p>
        <div class="emoji-dots">
            <span>🎯</span>
            <span>⚡</span>
            <span>🚀</span>
            <span>✨</span>
        </div>
        <div class="slide-hint">
            ✓ Light & Dark modes | Bold gradients | Modern sans-serif | Playful but professional
        </div>
    </div>

    <script>
        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            const btn = document.querySelector('.toggle-btn');
            btn.textContent = document.body.classList.contains('dark-mode') ? '☀️ Light Mode' : '🌙 Dark Mode';
        }
    </script>
</body>
</html>
