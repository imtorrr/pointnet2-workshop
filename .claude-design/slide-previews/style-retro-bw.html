<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro: Classic Black & White</title>
    <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=figtree:600,700,800&f[]=cascadia-code:500,600">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-light: #ffffff;
            --text-light: #000000;
            --accent-light: #1a1a1a;
            --border-light: #333333;

            --bg-dark: #1a1a1a;
            --text-dark: #ffffff;
            --accent-dark: #f5f5f5;
            --border-dark: #cccccc;
        }

        body {
            font-family: 'Figtree', sans-serif;
            background: var(--bg-light);
            color: var(--text-light);
            transition: background 0.3s, color 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
        }

        body.dark-mode {
            background: var(--bg-dark);
            color: var(--text-dark);
        }

        .preview-container {
            width: 100%;
            max-width: 1200px;
            padding: 4rem;
            border: 3px solid var(--border-light);
            border-radius: 16px;
            position: relative;
            background: var(--bg-light);
        }

        body.dark-mode .preview-container {
            background: var(--bg-dark);
            border-color: var(--border-dark);
        }

        .toggle-btn {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            padding: 0.7rem 1.5rem;
            background: var(--text-light);
            color: var(--bg-light);
            border: 2px solid var(--text-light);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.875rem;
            font-family: 'Cascadia Code', monospace;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        body.dark-mode .toggle-btn {
            background: var(--text-dark);
            color: var(--bg-dark);
            border-color: var(--text-dark);
        }

        h1 {
            font-family: 'Figtree', sans-serif;
            font-size: 4rem;
            line-height: 1;
            margin-bottom: 0.5rem;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .tagline {
            font-family: 'Cascadia Code', monospace;
            font-size: 0.875rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 2rem;
            opacity: 0.7;
        }

        p {
            font-size: 1.125rem;
            line-height: 1.8;
            margin-top: 1.5rem;
            font-weight: 500;
        }

        .feature-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.5rem;
            margin-top: 2.5rem;
        }

        .feature-card {
            padding: 1.5rem;
            border: 2px solid var(--border-light);
            border-radius: 12px;
            background: transparent;
            font-weight: 700;
            font-size: 0.95rem;
        }

        body.dark-mode .feature-card {
            border-color: var(--border-dark);
        }

        .feature-card .icon {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .accent-bar {
            width: 100%;
            height: 4px;
            background: var(--text-light);
            margin: 2rem 0;
        }

        body.dark-mode .accent-bar {
            background: var(--text-dark);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        h1 { animation: slideIn 0.6s ease-out; }
        p { animation: slideIn 0.6s ease-out 0.1s both; }
        .feature-grid { animation: slideIn 0.6s ease-out 0.2s both; }
    </style>
</head>
<body>
    <button class="toggle-btn" onclick="toggleDarkMode()">⌖ TOGGLE</button>

    <div class="preview-container">
        <h1>RETRO BW</h1>
        <div class="tagline">» Classic black & white</div>
        <div class="accent-bar"></div>

        <p>Timeless monochrome aesthetic. Bold typography, strong structure. Perfect for serious technical workshops.</p>

        <div class="feature-grid">
            <div class="feature-card">
                <div class="icon">◼</div>
                <strong>Bold & Clean</strong>
            </div>
            <div class="feature-card">
                <div class="icon">▮</div>
                <strong>Thick Strokes</strong>
            </div>
            <div class="feature-card">
                <div class="icon">□</div>
                <strong>Grid-Based</strong>
            </div>
            <div class="feature-card">
                <div class="icon">⬚</div>
                <strong>Minimal</strong>
            </div>
        </div>
    </div>

    <script>
        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
        }
    </script>
</body>
</html>
